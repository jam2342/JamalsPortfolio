name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these to publish; the token is scoped to this workflow only.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a queued one finish rather than
# cancelling it — a cancelled deploy can leave the site on an older build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Builds with BASE_PATH/SITE_URL set, then prefixes the root-absolute
      # links Astro leaves alone. See scripts/base-rewrite.mjs. The same
      # workflow runs in both repos (js-portfolio and the JamalsPortfolio
      # mirror), so the base path comes from whichever repo is building.
      - run: npm run build:pages
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
